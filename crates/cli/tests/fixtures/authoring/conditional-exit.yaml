schema_version: 1
id: authoring_demo
version: 1
title: Authoring demo
start: room
globals: {ready: false}
contexts:
  - id: room
    cues:
      - {cue_id: welcome, kind: narrative, narrative_id: shared_greeting}
      - {kind: actions, available_actions: eligible}
    actions:
      - id: leave
        when: {op: eq, left: {var: global.ready}, right: true}
        outcomes: [{goto: success}]
  - id: success
    terminal: true
    cues: [{kind: narrative, narrative_id: common.finished}]
