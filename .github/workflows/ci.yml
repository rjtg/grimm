name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  classic-cyoa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Reproduce the offline demo
        shell: bash
        run: |
          printf '1\n' | cargo run --offline --locked --quiet -p grimm-cli > demo.txt
          cat demo.txt
          grep -Fx '> The engine accepted your choice. Demo complete.' demo.txt
      - name: Play The Last Witness offline through every ending
        shell: bash
        run: |
          printf '1\n1\n1\n1\n' | cargo run --offline --locked --quiet -p grimm-cli -- play stories/the-last-witness.yaml > justice.txt
          grep -Fx 'Ending: A Voice in the Light' justice.txt
          printf '1\n1\n2\n1\n' | cargo run --offline --locked --quiet -p grimm-cli -- play stories/the-last-witness.yaml > exile.txt
          grep -Fx 'Ending: Truth Across the Water' exile.txt
          printf '2\n' | cargo run --offline --locked --quiet -p grimm-cli -- play stories/the-last-witness.yaml > silence.txt
          grep -Fx 'Ending: The Price of Silence' silence.txt
