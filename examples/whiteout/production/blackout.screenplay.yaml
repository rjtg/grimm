    content:
    - kind: narration
      text: 'AURORA / 03:17

        The ceiling lights die in a single line, from the laboratory to the sleeping quarters. Beyond
        the windows, blown snow erases the horizon. You are Alex, the station''s field engineer.


        Mara counts four people by torchlight. Jonas is on the floor with a crushed ankle. Lea''s
        hand-held radio plays the same broken distress call twice, down to the breath between words.
        Nobody here remembers sending it.


        The generator intake is freezing shut. The antenna motors have lost power. A rescue helicopter
        can reach Aurora only if a signal gets out before the storm closes the ridge. Take what you
        need, choose which repair comes first, and bring these people home. Text advances automatically;
        number keys choose. Esc opens a paused save menu; scroll back to reread. The dispatch hall
        is the safest checkpoint.'
