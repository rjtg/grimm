[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
grimm-semantic = { path = "crates/semantic" }
grimm-presentation = { path = "crates/presentation" }
grimm-engine = { path = "crates/engine" }
grimm-adapters = { path = "crates/adapters" }
grimm-cli-renderer = { path = "crates/cli-renderer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }

[workspace.lints.rust]
unsafe_code = "forbid"
